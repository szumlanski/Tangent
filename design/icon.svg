<!-- Tangent app icon, 1024 x 1024 full bleed. A circle and the line that just touches it. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" fill="#121417"/>
  <circle cx="452" cy="572" r="232" fill="#ff6a3d"/>
  <!-- Line tangent to the circle at 45deg (upper right). -->
  <line x1="326" y1="118" x2="896" y2="688" stroke="#f4f1ec" stroke-width="64" stroke-linecap="round"/>
  <circle cx="616" cy="408" r="40" fill="#f4f1ec"/>
</svg>

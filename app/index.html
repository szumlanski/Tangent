<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tangent</title>
<script>
// Signed out and not looking around as a guest: show the welcome page instead of the app.
(function () {
  try {
    if (/(^|;\s*)tg_(in|guest)=1/.test(document.cookie) || localStorage.getItem("ownerKey") || /key=/.test(location.hash)) return;
  } catch (e) { return; }
  location.replace("/welcome");
})();
</script>
<meta name="description" content="Your news, no paywalls, one card per story">
<meta name="theme-color" content="#121417">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tangent">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="app-icon-v2-192.png" type="image/png">
<link rel="apple-touch-icon" href="app-icon-v2-180.png">
<style>
:root {
  --bg: #f4f1ec;
  --card: #ffffff;
  --label: #16181b;
  --label-2: #5c5f66;       /* 6.3:1 on white */
  --sep: rgba(22, 24, 27, 0.12);
  --tint: #c8401a;          /* 5.1:1 on white */
  --accent: #ff6a3d;
  --head: #121417;
  --bar: rgba(244, 241, 236, 0.82);
  --shade: rgba(0, 0, 0, 0.18);
  --f-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --f-head: ui-serif, "New York", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --top: calc(env(safe-area-inset-top, 0px) + 100px);
  --tabbar: calc(54px + env(safe-area-inset-bottom, 0px));
  --up: #1d8a43; --down: #d23c25;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0c0d0f; --card: #1a1c20; --label: #f2f1ee; --label-2: #a3a6ad; --sep: rgba(255,255,255,0.1); --tint: #ff8a63; --bar: rgba(12,13,15,0.8); --shade: rgba(0,0,0,0.5); --up: #3ccf6e; --down: #ff6b55; color-scheme: dark; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--label); font: 400 17px/1.4 var(--f-ui); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--tint); outline-offset: 2px; border-radius: 8px; }

/* Top bar: masthead + topic tabs + kind filter */
.bar { position: fixed; inset: 0 0 auto 0; z-index: 20; background: var(--bar); backdrop-filter: saturate(1.6) blur(18px); -webkit-backdrop-filter: saturate(1.6) blur(18px); border-bottom: 0.5px solid var(--sep); padding-top: env(safe-area-inset-top, 0px); }
.mast { display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 8px 0 16px; max-width: 1280px; margin: 0 auto; }
.logo { min-height: 44px; font: 700 26px/1 var(--f-head); letter-spacing: -0.02em; display: flex; align-items: center; gap: 4px; }
.logo .mark { width: 22px; height: 24px; flex: none; }
.mast-r { display: flex; align-items: center; }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 22px; color: var(--label-2); }
.icon-btn svg { width: 22px; height: 22px; }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding: 0 12px 8px; max-width: 1280px; margin: 0 auto; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; height: 36px; padding: 0 14px; border-radius: 18px; font-size: 15px; font-weight: 600; color: var(--label-2); white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--label); color: var(--bg); }
.kinds { display: inline-flex; background: var(--sep); border-radius: 9px; padding: 2px; margin-right: 4px; }
.kinds button { height: 30px; padding: 0 10px; border-radius: 7px; font-size: 13px; font-weight: 600; color: var(--label-2); }
.kinds button[aria-pressed="true"] { background: var(--card); color: var(--label); box-shadow: 0 1px 3px var(--shade); }

/* Cards */
.card { position: relative; display: flex; flex-direction: column; background: var(--card); border-radius: 14px; overflow: hidden; text-align: left; width: 100%; height: 100%; min-height: 0; box-shadow: 0 1px 2px var(--shade); }
.card .img { position: relative; flex: 1 1 55%; min-height: 0; background: #2a2d33 center/cover no-repeat; }
.card .img .play { position: absolute; left: 12px; bottom: 12px; display: flex; align-items: center; gap: 6px; background: rgba(0,0,0,.72); color: #fff; font-size: 13px; font-weight: 600; padding: 6px 10px 6px 8px; border-radius: 16px; }
.card .img .play svg { width: 14px; height: 14px; }
.card .txt { flex: 0 1 auto; padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; min-height: 0; overflow: hidden; }
.meta { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--label-2); white-space: nowrap; overflow: hidden; }
.meta b { font-weight: 600; color: var(--label); overflow: hidden; text-overflow: ellipsis; }
.meta .k { color: var(--tint); font-weight: 600; }
.card h3 { margin: 0; font: 700 20px/1.2 var(--f-head); letter-spacing: -0.01em; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; overflow: hidden; }
.card p { margin: 0; font-size: 15px; line-height: 1.4; color: var(--label-2); display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
.card.big h3 { font-size: 28px; -webkit-line-clamp: 4; }
.card.noimg { background: var(--card); }
.card.noimg .txt { flex: 1; justify-content: flex-start; }
.card.noimg h3 { -webkit-line-clamp: 6; }
.card.noimg::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--accent); }
.card.small .img { display: none; }
.card.small h3 { font-size: 18px; -webkit-line-clamp: 3; }
.card.small p { -webkit-line-clamp: 2; }

/* Phone: flip stage */
.stage { position: fixed; left: 0; right: 0; top: var(--top); bottom: var(--tabbar); perspective: 2200px; touch-action: none; overflow: hidden; }
.page { position: absolute; inset: 0; padding: 12px; display: grid; gap: 12px; background: var(--bg); }
.page.l1 { grid-template-rows: 1fr; }
.page.l2 { grid-template-rows: 1fr 1fr; }
.page.l3 { grid-template-rows: 1.25fr 1fr; grid-template-columns: 1fr 1fr; }
.page.l3 > :first-child { grid-column: 1 / -1; }
.page.list { grid-template-rows: repeat(4, 1fr); }
.page.list .card h3 { -webkit-line-clamp: 3; }
.half-top { clip-path: inset(0 0 50% 0); }
.half-bot { clip-path: inset(50% 0 0 0); }
.flap { position: absolute; inset: 0; transform-style: preserve-3d; transform-origin: 50% 50%; will-change: transform; }
.flap > .page { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.flap > .back { transform: rotateX(180deg); }
.dim { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }
.pager { position: fixed; right: 4px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 5px; z-index: 5; pointer-events: none; }
.pager i { width: 4px; height: 4px; border-radius: 2px; background: var(--label-2); opacity: .35; }
.pager i.on { opacity: 1; height: 14px; background: var(--accent); }

/* Desktop: magazine grid */
.grid { display: none; max-width: 1280px; margin: 0 auto; padding: calc(var(--top) + 20px) 24px 48px; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 210px; gap: 20px; }
.grid .card.big { grid-column: span 2; grid-row: span 2; }
.grid .card.wide { grid-column: span 2; }
.grid .card.tall { grid-row: span 2; }
.grid .card:not(.big):not(.tall):not(.noimg) h3 { -webkit-line-clamp: 2; font-size: 18px; }
.grid .card.noimg h3 { -webkit-line-clamp: 4; }
@media (min-width: 900px) {
  .stage, .pager { display: none; }
  .grid { display: grid; }
  .card { transition: transform .15s ease, box-shadow .15s ease; }
  .card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px var(--shade); }
}
@media (min-width: 900px) and (max-width: 1100px) { .grid { grid-template-columns: repeat(3, 1fr); } }

.empty { position: fixed; inset: var(--top) 0 0; display: grid; place-items: center; text-align: center; color: var(--label-2); padding: 24px; }

/* Reader */
/* The panel slides; an inner box scrolls. A transformed scroller paints out of sync on mobile. */
.reader { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: flex; flex-direction: column; overflow: hidden; transform: translateY(100%); transition: transform .32s cubic-bezier(.2,.8,.2,1); }
.rscroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; overflow-anchor: none; }
.reader.open { transform: none; }
.rbar { flex: none; z-index: 2; display: flex; justify-content: space-between; align-items: center; padding: env(safe-area-inset-top, 0px) 4px 0; height: calc(52px + env(safe-area-inset-top, 0px)); background: var(--bar); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-bottom: 0.5px solid var(--sep); }
.rbar .pill { height: 36px; padding: 0 14px; margin-right: 8px; border-radius: 18px; background: var(--label); color: var(--bg); font-size: 15px; font-weight: 600; display: inline-flex; align-items: center; text-decoration: none; }
.rbody { max-width: 680px; margin: 0 auto; padding: 20px 20px calc(60px + env(safe-area-inset-bottom, 0px)); }
.rbody .hero { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 12px; background: #2a2d33; display: block; }
.rbody .video { width: 100%; aspect-ratio: 16/9; border: 0; border-radius: 12px; display: block; background: #000; }
.rbody h1 { font: 700 30px/1.15 var(--f-head); letter-spacing: -0.015em; margin: 18px 0 10px; }
.rbody .meta { white-space: normal; margin-bottom: 18px; }
.prose { font: 400 19px/1.6 var(--f-head); }
.prose img, .prose video, .prose figure { max-width: 100%; height: auto; border-radius: 8px; }
.prose figure { margin: 20px 0; }
.prose figcaption { font: 13px/1.4 var(--f-ui); color: var(--label-2); margin-top: 6px; }
.prose a { color: var(--tint); }
.prose h2, .prose h3 { font-family: var(--f-head); line-height: 1.25; }
.prose blockquote { margin: 16px 0; padding-left: 16px; border-left: 3px solid var(--accent); color: var(--label-2); }
.prose pre { overflow-x: auto; font-size: 14px; background: var(--card); padding: 12px; border-radius: 8px; }
.prose table { display: block; overflow-x: auto; }
.racts { display: flex; align-items: center; }
.racts .icon-btn[aria-pressed="true"] { color: var(--tint); }
.racts .icon-btn[aria-pressed="true"] svg { fill: currentColor; fill-opacity: .18; }
/* Vote and hide right from the list: a small pill in the card's top-right corner. */
.card .acts { position: absolute; top: 6px; right: 6px; z-index: 2; display: flex; border-radius: 17px; background: rgba(0,0,0,.5); color: #fff; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.card .acts > span { position: relative; width: 36px; height: 34px; display: grid; place-items: center; }
.card .acts > span::after { content: ""; position: absolute; inset: -5px 0; } /* 44px tall touch target */
.card .acts svg { width: 17px; height: 17px; }
.card .acts [aria-pressed="true"] { color: var(--accent); }
.card .acts [aria-pressed="true"] svg { fill: currentColor; fill-opacity: .25; }
.card.noimg .acts, .card.small .acts { background: var(--sep); color: var(--label-2); backdrop-filter: none; -webkit-backdrop-filter: none; }
/* Text cards keep the pill out of the outlet line: bottom-right, where there is room. */
.card.noimg .acts, .card.small .acts { top: auto; bottom: 8px; right: 8px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar) + 14px); z-index: 50; display: flex; align-items: center; gap: 14px; background: var(--label); color: var(--bg); padding: 10px 10px 10px 16px; border-radius: 22px; font-size: 15px; box-shadow: 0 6px 20px var(--shade); max-width: calc(100% - 32px); }
.toast button { color: var(--accent); font-weight: 700; height: 32px; padding: 0 10px; }
.lock { display: inline-flex; align-items: center; gap: 3px; color: var(--label-2); font-weight: 600; }
.lock svg, .notice svg { width: 13px; height: 13px; vertical-align: -1px; }
.sum, .also { background: var(--card); border-radius: 12px; padding: 12px 16px; margin: 0 0 18px; }
.sum-h { font-size: 13px; font-weight: 700; color: var(--tint); margin-bottom: 6px; }
.sum ul { margin: 0; padding-left: 20px; font-size: 16px; line-height: 1.45; }
.sum li + li { margin-top: 6px; }
.also button { display: grid; gap: 2px; width: 100%; text-align: left; padding: 10px 0; min-height: 44px; border-top: 0.5px solid var(--sep); font-size: 15px; }
.also button:first-of-type { border-top: 0; }
.also button span { color: var(--label-2); line-height: 1.35; }
.teaser { font-size: 19px; line-height: 1.55; color: var(--label-2); }
.notice { margin-top: 24px; padding: 14px 16px; background: var(--card); border-radius: 12px; font-size: 15px; color: var(--label-2); }

/* Sources sheet */
.list { background: var(--card); border-radius: 12px; overflow: hidden; margin: 0 0 20px; padding: 0; list-style: none; }
.list li { padding: 11px 16px; position: relative; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center; }
.list li + li::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: 0.5px solid var(--sep); }
.list .n { font-weight: 600; }
.list .s { grid-column: 1; font-size: 13px; color: var(--label-2); overflow-wrap: anywhere; }
.list .dot { grid-row: 1 / span 2; grid-column: 2; width: 10px; height: 10px; border-radius: 5px; }
.ok { background: #2fa84f; } .bad { background: #e0442b; } .off { background: #8e8e93; }
.sec { font-size: 13px; color: var(--label-2); margin: 20px 16px 8px; }

/* Sections: bottom tab bar on phones, inline in the masthead on desktop */
.sections { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; height: var(--tabbar); padding-bottom: env(safe-area-inset-bottom, 0px); display: flex; background: var(--bar); backdrop-filter: saturate(1.6) blur(18px); -webkit-backdrop-filter: saturate(1.6) blur(18px); border-top: 0.5px solid var(--sep); }
.sections button { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--label-2); }
.sections svg { width: 26px; height: 26px; }
.sections button[aria-selected="true"] { color: var(--tint); }
body:not(.v-news) .tabs, body:not(.v-news) .kinds, body:not(.v-news) .stage, body:not(.v-news) .pager, body:not(.v-news) .grid, body:not(.v-news) .empty { display: none !important; }
body:not(.v-news) { --top: calc(env(safe-area-inset-top, 0px) + 49px); }
.view { max-width: 1280px; margin: 0 auto; padding: calc(var(--top) + 12px) 12px calc(var(--tabbar) + 24px); }
.view h2 { font: 700 24px/1.2 var(--f-head); margin: 22px 4px 10px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.view h2 small { font: 400 13px var(--f-ui); color: var(--label-2); }
.panel { background: var(--card); border-radius: 14px; box-shadow: 0 1px 2px var(--shade); overflow: hidden; }
.muted { color: var(--label-2); font-size: 13px; }

/* Stocks */
.ranges { display: flex; background: var(--sep); border-radius: 9px; padding: 2px; margin: 4px 0 12px; position: sticky; top: calc(var(--top) + 4px); z-index: 5; }
.ranges button { flex: 1; height: 32px; border-radius: 7px; font-size: 14px; font-weight: 600; color: var(--label-2); }
.ranges button[aria-pressed="true"] { background: var(--card); color: var(--label); box-shadow: 0 1px 3px var(--shade); }
.quotes { display: grid; gap: 12px; grid-template-columns: 1fr; }
.quote { padding: 14px 16px 10px; }
.quote .top { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: baseline; }
.quote .nm { font-weight: 700; font-size: 17px; }
.quote .px { font: 600 22px/1.1 var(--f-ui); font-variant-numeric: tabular-nums; text-align: right; }
.quote .sub { font-size: 13px; color: var(--label-2); }
.quote .chg { font-size: 15px; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.up { color: var(--up); } .down { color: var(--down); }
.chart { position: relative; margin-top: 10px; touch-action: pan-y; }
.chart svg { width: 100%; height: 128px; display: block; overflow: visible; }
.chart .tip { position: absolute; top: -2px; transform: translateX(-50%); background: var(--label); color: var(--bg); font-size: 12px; font-weight: 600; padding: 3px 7px; border-radius: 6px; white-space: nowrap; pointer-events: none; font-variant-numeric: tabular-nums; }
.chart .axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--label-2); margin-top: 4px; font-variant-numeric: tabular-nums; }
@media (min-width: 900px) { .quotes { grid-template-columns: repeat(2, 1fr); } .ranges { max-width: 520px; } }

/* Sports */
.games { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.game { padding: 12px 14px; display: grid; gap: 6px; text-decoration: none; }
.game .row { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; min-height: 28px; }
.game img { width: 28px; height: 28px; object-fit: contain; }
.game .tm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.game .tm em { font-style: normal; font-size: 12px; color: var(--label-2); font-weight: 600; margin-right: 4px; }
.game .sc { font: 700 20px var(--f-ui); font-variant-numeric: tabular-nums; }
.game .lose { opacity: .55; }
.game .st { font-size: 13px; color: var(--label-2); display: flex; justify-content: space-between; gap: 8px; }
.game .st .live { color: var(--down); font-weight: 700; }
.team { padding: 14px 16px; display: grid; gap: 10px; }
.team .games { grid-template-columns: 1fr; }
.teams { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
.team .hd { display: flex; align-items: center; gap: 12px; }
.team .hd img { width: 44px; height: 44px; object-fit: contain; }
.team .hd b { font-size: 19px; display: block; }
.poll { columns: 2; column-gap: 24px; padding: 12px 16px; font-size: 15px; }
.poll div { break-inside: avoid; padding: 4px 0; display: flex; gap: 8px; }
.poll span { width: 22px; text-align: right; color: var(--label-2); font-variant-numeric: tabular-nums; }
@media (min-width: 900px) { .poll { columns: 4; } }
.heads { list-style: none; margin: 0; padding: 0; }
.heads li { position: relative; }
.heads li + li::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: 0.5px solid var(--sep); }
.heads a { display: grid; grid-template-columns: 1fr 72px; gap: 12px; padding: 12px 16px; text-decoration: none; align-items: center; min-height: 64px; }
.heads a b { font: 700 17px/1.25 var(--f-head); }
.heads img { width: 72px; height: 48px; object-fit: cover; border-radius: 6px; background: #2a2d33; }
.rail { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(240px, 280px); gap: 12px; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x mandatory; }
.rail .card { height: 230px; scroll-snap-align: start; }
details.panel summary { padding: 12px 16px; font-weight: 600; cursor: pointer; min-height: 44px; }

/* Local trends */
.card.trend { padding: 14px 16px; gap: 6px; overflow: auto; }
.card.trend > * { flex: none; }
/* On the flip stage the card must not scroll: a scrollable card swallows the swipe. */
.stage .card.trend { overflow: hidden; }
.trend li a em { font-style: normal; flex: 1; min-width: 0; }
.stage .trend li a em { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trend a { -webkit-user-drag: none; -webkit-touch-callout: none; }
.trend h3 { font: 700 22px/1.2 var(--f-head); margin: 0; -webkit-line-clamp: unset; display: block; }
.trend ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; grid-template-columns: minmax(0, 1fr); }
.trend li a { display: flex; gap: 10px; align-items: baseline; padding: 7px 0; text-decoration: none; font-size: 16px; line-height: 1.3; }
.trend li a span { flex: none; font-size: 12px; font-weight: 700; color: var(--tint); min-width: 44px; }
.trend .grp { font-size: 12px; font-weight: 700; color: var(--label-2); margin-top: 8px; letter-spacing: .02em; }

/* Suggestions */
.sugg { padding: 12px 16px; display: grid; gap: 6px; }
.sugg + .sugg { border-top: 0.5px solid var(--sep); }
.sugg .acts { display: flex; gap: 8px; margin-top: 4px; }
.sugg .acts button { height: 36px; padding: 0 16px; border-radius: 18px; font-size: 15px; font-weight: 600; background: var(--sep); }
.sugg .acts button.add { background: var(--label); color: var(--bg); }
.sugg ul { margin: 0; padding-left: 18px; font-size: 14px; color: var(--label-2); }

@media (min-width: 900px) {
  :root { --tabbar: 0px; }
  .sections { top: calc(env(safe-area-inset-top, 0px) + 6px); bottom: auto; left: 50%; right: auto; transform: translateX(-50%); height: 36px; padding: 0; background: none; backdrop-filter: none; -webkit-backdrop-filter: none; border: 0; gap: 4px; }
  .sections button { flex-direction: row; gap: 6px; font-size: 15px; padding: 0 12px; height: 36px; border-radius: 18px; }
  .sections svg { width: 20px; height: 20px; }
  .sections button[aria-selected="true"] { background: var(--sep); }

<script>
const SB = "https://kyplwgcvbfzyfhiyspsr.supabase.co/rest/v1/";
const SB_KEY = "sb_publishable_LqD81rhJPP9kVN_Rdw22eQ_jhZ3Hc_r"; // public by design; RLS guards the data
// Tabs for people looking around without an account: common news categories.
const TOPICS = [
  ["", "For you"], ["us", "U.S."], ["world", "World"], ["politics", "Politics"], ["business", "Business"],
  ["tech", "Tech & AI"], ["science", "Science"], ["health", "Health"], ["climate", "Climate"],
  ["entertainment", "Entertainment"], ["food", "Food"], ["travel", "Travel"],
];
// Names for every topic in the catalog, including ones only on some people's shelves.
const TOPIC_NAMES = Object.fromEntries([...TOPICS.slice(1), ["sports", "Sports"], ["solar", "Solar & energy"], ["swfl", "SW Florida"], ["vermont", "Vermont"], ["custom", "Added by readers"]]);
const KIND_LABEL = { youtube: "Video", blog: "Blog", podcast: "Podcast" };

const $ = id => document.getElementById(id);
const store = {
  get(k, f) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : f; } catch { return f; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const isDesktop = () => matchMedia("(min-width: 900px)").matches;

function ago(iso) {
  const m = Math.max(1, Math.round((Date.now() - Date.parse(iso)) / 6e4));
  if (m < 60) return m + "m";
  const h = Math.round(m / 60);
  if (h < 24) return h + "h";
  return Math.round(h / 24) + "d";
}
const dur = s => s ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}` : "";

async function sb(path) {
  const r = await fetch(SB + path, { headers: { apikey: SB_KEY, authorization: "Bearer " + SB_KEY } });
  if (!r.ok) throw new Error(r.status + " " + (await r.text()));
  return r.json();
}

/* ---------- state ---------- */
const state = {
  topic: store.get("topic", ""),
  kind: store.get("kind", ""),
  items: store.get("feed", []),
  page: 0,
};

// Spread sources out so one busy outlet cannot fill a page.
function diversify(items) {
  const pool = items.slice();
  const out = [];
  while (pool.length) {
    const recent = out.slice(-4).map(i => i.source_id);
    let k = pool.findIndex(i => !recent.includes(i.source_id));
    if (k < 0) k = 0;
    out.push(pool.splice(k, 1)[0]);
  }
  return out;
}

// Some feeds hand over a blank headline, which ends up as just the outlet name ("- Lonely Planet").
const junkTitle = i => i.title.replace(new RegExp(i.source_name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "i"), "").replace(/[^a-z0-9]/gi, "").length < 8;
function visible() {
  const tab = curTab();
  const list = state.items.filter(i => inTab(i, tab) && !isHidden(i) && !junkTitle(i) && (!state.kind || i.kind === state.kind));
  // One card per story. Articles not grouped yet fall back to a headline match.
  const groups = new Map();
  for (const i of list) {
    const key = i.cluster_id ? "c" + i.cluster_id : "t" + i.title.toLowerCase().replace(/[^a-z0-9]+/g, " ").trim().slice(0, 60);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(i);
  }
  const cards = [...groups.values()].map(members => {
    // Lead with the outlet that has a picture and full text; the story sorts by its newest article.
    const lead = members.find(m => m.image && m.extracted) || members.find(m => m.image) || members[0];
    return { ...lead, members, newest: members.reduce((t, m) => m.published_at > t ? m.published_at : t, lead.published_at) };
  });
  // Freshness decays over about a day and a half; your votes shift a story by hours, not days:
  // 3 thumbs-down on a source is like its stories being ~3 hours older, 10 is ~7 hours.
  const now = Date.now();
  for (const c of cards) c.rank = Math.exp(-(now - Date.parse(c.newest)) / 36e5 / 36) * Math.exp(0.4 * prefScore(c));
  cards.sort((a, b) => b.rank - a.rank);
  return diversify(cards);
}

/* ---------- cards ---------- */
const ICON_LOCK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>`;
// Hide is one action everywhere (feed card and story view), so it has one icon.
const ICON_HIDE = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6 0 9.5 7 9.5 7a17 17 0 0 1-3 3.8M6.2 6.2C3.8 7.9 2.5 12 2.5 12S6 19 12 19a9.6 9.6 0 0 0 5.3-1.5M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>`;
const ICON_UP = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M7 10v11H3V10zM7 10l4-8a2.5 2.5 0 0 1 3 2.5V9h5.5a2 2 0 0 1 2 2.3l-1.3 8A2 2 0 0 1 18.2 21H7"/></svg>`;
const ICON_DOWN = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M17 14V3h4v11zM17 14l-4 8a2.5 2.5 0 0 1-3-2.5V15H4.5a2 2 0 0 1-2-2.3l1.3-8A2 2 0 0 1 5.8 3H17"/></svg>`;
function cardHTML(it, size) {
  const hasImg = /^https?:\/\//.test(it.image || "") && size !== "small";
  const kind = KIND_LABEL[it.kind] ? `<span class="k">${KIND_LABEL[it.kind]}</span><span>·</span>` : "";
  const many = (it.story_size || 1) > 1 ? `<span>·</span><span class="k">${it.story_size} outlets</span>` : "";
  const lock = it.locked ? `<span>·</span><span class="lock" title="Subscriber article: opens on the paper's site">${ICON_LOCK} Subscriber</span>` : "";
  const title = (it.story_size || 1) > 1 && it.story_headline ? it.story_headline : it.title;
  const blurb = it.summary_short || it.excerpt;
  const play = it.kind === "youtube" ? `<span class="play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>${dur(it.duration_s) || "Play"}</span>` : "";
  return `<button class="card ${size || ""} ${hasImg ? "" : "noimg"}" data-id="${it.id}">
    <span class="acts">
      <span role="button" aria-label="More like this" aria-pressed="${votes.get(it.id) === 1}" data-cvote="1" data-for="${it.id}">${ICON_UP}</span>
      <span role="button" aria-label="Fewer like this" aria-pressed="${votes.get(it.id) === -1}" data-cvote="-1" data-for="${it.id}">${ICON_DOWN}</span>
      <span role="button" aria-label="Hide this story" data-hide="${it.id}">${ICON_HIDE}</span>
    </span>
    ${hasImg ? `<div class="img" style="background-image:url('${esc(it.image).replace(/'/g, "%27")}')">${play}</div>` : ""}
    <div class="txt">
      <div class="meta">${kind}<b>${esc(it.source_name)}</b><span>·</span><span>${ago(it.newest || it.published_at)}</span>${many}${lock}</div>
      <h3>${esc(title)}</h3>
      ${blurb && (!hasImg || size === "big" || it.summary_short) ? `<p>${esc(blurb)}</p>` : ""}
    </div>
  </button>`;
}

/* ---------- phone pages ---------- */
// Picture stories cycle hero, pair, trio. Stories with no picture are gathered
// four to a page as headlines, so no page is a big empty card.
function buildPages(list) {
  const pages = [], text = [], pics = [], pattern = [1, 2, 3, 2];
  let p = 0;
  for (const it of list) {
    if (!it.image) {
      text.push(it);
      if (text.length === 4) pages.push({ layout: "list", items: text.splice(0) });
      continue;
    }
    pics.push(it);
    const want = pattern[p % pattern.length];
    if (pics.length === want) { pages.push({ layout: "l" + want, items: pics.splice(0) }); p++; }
  }
  if (pics.length) pages.push({ layout: "l" + pics.length, items: pics });
  if (text.length) pages.push({ layout: "list", items: text });
  if (showTrends()) pages.splice(Math.min(1, pages.length), 0, { layout: "l1", trend: true, items: [] });
  return pages;
}
function pageEl(pg, extra = "") {
  const el = document.createElement("div");
  el.className = `page ${pg.layout} ${extra}`;
  const size = k => pg.layout === "l1" ? "big" : pg.layout === "list" || (pg.layout === "l3" && k > 0) ? "small" : "";
  el.innerHTML = pg.trend ? trendHTML() : pg.items.map((it, k) => cardHTML(it, size(k))).join("");
  return el;
}

let pages = [];
function renderStage() {
  const stage = $("stage");
  stage.replaceChildren();
  if (!pages.length) return;
  state.page = Math.min(state.page, pages.length - 1);
  stage.append(pageEl(pages[state.page]));
  renderPager();
}
function renderPager() {
  const n = pages.length, cur = state.page;
  const from = Math.max(0, Math.min(cur - 4, n - 9)), to = Math.min(n, from + 9);
  $("pager").innerHTML = Array.from({ length: to - from }, (_, k) => `<i class="${from + k === cur ? "on" : ""}"></i>`).join("");
}

/* Flipboard fold: the page folds at its horizontal midline.
   Forward: the bottom half of the current page swings up, its back shows the next page's top half. */
let flip = null;
function startFlip(dir) {
  const to = state.page + dir;
  if (to < 0 || to >= pages.length) return null;
  const stage = $("stage");
  const cur = pages[state.page], nxt = pages[to];
  stage.replaceChildren();
  const base = pageEl(nxt);                                         // what is revealed underneath

// Drag to flip. A short move is a tap and opens the card.
(() => {
  const stage = $("stage");
  let y0 = null, x0 = 0, dragging = false, h = 1;
  stage.addEventListener("pointerdown", e => {
    if (flip) return;
    y0 = e.clientY; x0 = e.clientX; dragging = false; h = stage.clientHeight;
  });
  stage.addEventListener("pointermove", e => {
    if (y0 == null) return;
    const dy = e.clientY - y0;
    if (!dragging && Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(e.clientX - x0)) {
      const f = startFlip(dy < 0 ? 1 : -1);
      if (!f) { y0 = null; return; }
      flip = f; dragging = true;
      stage.setPointerCapture(e.pointerId);
    }
    if (dragging) setAngle(flip, Math.max(0, Math.min(180, (Math.abs(dy) / (h * 0.55)) * 180 * Math.sign(-dy * flip.dir))));

    if (y0 == null) return;
    if (dragging && flip) finishFlip(flip, flip.angle > 70);
    else if (!dragging && e.type === "pointerup" && !e.target.closest("a")) {
      const x = e.target.closest("[data-hide]");
      if (x) { hideStory(+x.dataset.hide); y0 = null; return; }
      const cv = e.target.closest("[data-cvote]");
      if (cv) { vote(+cv.dataset.for, +cv.dataset.cvote); y0 = null; return; }
      const card = e.target.closest(".card");
      if (card) openReader(+card.dataset.id);
    }
    y0 = null; dragging = false;
  };

  stage.addEventListener("pointercancel", end);

    if (e.key === "ArrowUp" || e.key === "PageUp") { e.preventDefault(); go(-1); }
  });
})();

// Article HTML comes from third-party sites via Readability. Strip anything active.
function clean(html, base) {
  const doc = new DOMParser().parseFromString(html || "", "text/html");
  doc.querySelectorAll("script,style,iframe,object,embed,form,input,button,link,meta,noscript").forEach(n => n.remove());
  for (const el of doc.body.querySelectorAll("*")) {
    for (const a of [...el.attributes]) {
      const n = a.name.toLowerCase(), v = a.value.trim().toLowerCase();
      // Site class and id names can collide with ours (a WINK article has class="page").
      if (n.startsWith("on") || n === "style" || n === "class" || n === "id" || n === "srcset" && el.tagName !== "IMG" || (n === "href" || n === "src") && v.startsWith("javascript:")) el.removeAttribute(a.name);
    }
    if (el.tagName === "A") { try { el.href = new URL(el.getAttribute("href") || "", base).href; } catch {} el.target = "_blank"; el.rel = "noopener noreferrer"; }
    if (el.tagName === "IMG") { try { el.src = new URL(el.getAttribute("src") || el.dataset.src || "", base).href; } catch {} el.loading = "lazy"; el.removeAttribute("width"); el.removeAttribute("height"); }
  }
  return doc.body.innerHTML;
}

async function openReader(id, swap = false) {

// Panels reuse the reader sheet. Moving between panels swaps the content in place.

async function loadStocks() {

      const d = await r.json();

function drawQuote(sym) {

  el.querySelector(".px").textContent = fmt(d.last, dec);
  const day = el.querySelector(".day");
  day.textContent = pctTxt(d.last, d.prev) + " today";
  day.className = "chg day " + (d.last >= d.prev ? "up" : "down");
  const first = d.points[0][1];
  const up = d.last >= first;
  const svg = el.querySelector("svg");

  // 1D spans the whole session even before the close, so the line grows across the day.
  const x = stockRange === "1d" ? (i => i / Math.max(d.points.length - 1, 389) * W) : (i => (d.points[i][0] - t0) / ts * W);

  const prevY = stockRange === "1d" && d.prev >= lo && d.prev <= hi ? `<line x1="0" x2="${W}" y1="${y(d.prev)}" y2="${y(d.prev)}" stroke="var(--label-2)" stroke-dasharray="3 4" stroke-width="1" opacity=".6"/>` : "";
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML = `<defs><linearGradient id="g-${sym}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${up ? "#1d8a43" : "#d23c25"}" stop-opacity=".22"/><stop offset="1" stop-color="${up ? "#1d8a43" : "#d23c25"}" stop-opacity="0"/></linearGradient></defs>
    ${prevY}<path d="${line}L${x(d.points.length - 1).toFixed(1)},${H}L0,${H}Z" fill="url(#g-${sym})"/><path d="${line}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle class="dot" r="4" fill="${col}" cx="0" cy="0" opacity="0"/>`;
  svg._x = x; svg._y = y; svg._w = W;

  el.querySelector(".a0").textContent = stockRange === "1d" ? "9:30" : fd(t0);
  el.querySelector(".a1").textContent = stockRange === "1d" ? "4:00" : fd(t1);
  const rc = el.querySelector(".rc");
  rc.textContent = stockRange === "1d" ? `${d.source}` : `${RANGE_LABEL.find(r => r[0] === stockRange)[1]} ${pctTxt(d.last, first).replace(/^.*\(/, "").replace(")", "")}`;
  rc.className = "rc " + (stockRange === "1d" ? "" : up ? "up" : "down");
}
// Touch or hover the chart to read a price.
function wireScrub(sym) {
  const el = $("q-" + sym), box = el.querySelector(".chart"), tip = el.querySelector(".tip");
  const move = e => {
    const d = charts[sym], svg = box.querySelector("svg");
    if (!d || !svg._x) return;
    const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) / r.width * svg._w;
    let best = 0, bd = Infinity;
    for (let i = 0; i < d.points.length; i++) { const dd = Math.abs(svg._x(i) - px); if (dd < bd) { bd = dd; best = i; } }
    const [t, v] = d.points[best];
    const dot = svg.querySelector(".dot");
    dot.setAttribute("cx", svg._x(best)); dot.setAttribute("cy", svg._y(v)); dot.setAttribute("opacity", "1");
    tip.hidden = false;
    tip.style.left = Math.min(Math.max(svg._x(best) / svg._w * r.width, 40), r.width - 40) + "px";
    const when = new Date(t).toLocaleString("en-US", stockRange === "1d" || stockRange === "7d" ? { hour: "numeric", minute: "2-digit", month: stockRange === "7d" ? "short" : undefined, day: stockRange === "7d" ? "numeric" : undefined, timeZone: d.source === "Yahoo" ? "America/New_York" : "UTC" } : { month: "short", day: "numeric", year: "numeric", timeZone: "UTC" });
    tip.textContent = `${fmt(v)} · ${when}`;
  };
  const leave = () => { tip.hidden = true; const dot = box.querySelector(".dot"); if (dot) dot.setAttribute("opacity", "0"); };
  box.addEventListener("pointermove", move);
  box.addEventListener("pointerdown", move);
  box.addEventListener("pointerleave", leave);
  box.addEventListener("pointerup", e => { if (e.pointerType !== "mouse") leave(); });
}

const MY_TEAMS = [["57", "Florida"], ["127", "Michigan State"]];
const OTHER_LEAGUES = [
  ["basketball/nba", "NBA"], ["hockey/nhl", "NHL"], ["baseball/mlb", "MLB"], ["basketball/wnba", "WNBA"],
  ["soccer/usa.1", "MLS"], ["basketball/mens-college-basketball", "College basketball"],
];
// Through our edge proxy: ESPN's own CORS headers come and go.
const espn = path => {
  const [p, q] = path.split("?");
  return fetch(`/api/espn?p=${encodeURIComponent(p)}${q ? "&" + q : ""}`).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
};
const val = v => v == null ? "" : typeof v === "object" ? (v.displayValue ?? v.value ?? "") : v;

function gameHTML(ev, opts = {}) {
  const c = ev.competitions?.[0] || ev;
  const st = (c.status || ev.status)?.type || {};
  const teams = [...(c.competitors || [])].sort((a, b) => (a.homeAway === "away" ? -1 : 1));
  const done = st.state === "post", live = st.state === "in";
  const scores = teams.map(t => +val(t.score) || 0);
  const row = (t, i) => {
    const rank = t.curatedRank?.current && t.curatedRank.current < 26 ? `<em>${t.curatedRank.current}</em>` : "";
    const logo = t.team?.logo || t.team?.logos?.[0]?.href || "";
    const lose = done && scores[i] < scores[1 - i];
    return `<div class="row ${lose ? "lose" : ""}">${logo ? `<img src="${esc(logo)}" alt="" loading="lazy">` : "<span></span>"}<span class="tm">${rank}${esc(t.team?.shortDisplayName || t.team?.displayName || "")}</span><span class="sc">${st.state === "pre" ? "" : esc(val(t.score))}</span></div>`;
  };
  const when = st.state === "pre"
    ? new Date(ev.date).toLocaleString("en-US", { weekday: "short", hour: "numeric", minute: "2-digit" })
    : st.shortDetail || st.detail || "";
  const tv = c.broadcasts?.[0]?.names?.[0] || c.broadcasts?.[0]?.media?.shortName || "";
  const link = ev.links?.find(l => l.rel?.includes("summary"))?.href || ev.links?.[0]?.href || "";
  return `<a class="panel game" href="${esc(link)}" target="_blank" rel="noopener noreferrer">
    ${teams.map(row).join("")}
    <div class="st"><span class="${live ? "live" : ""}">${live ? "LIVE · " : ""}${esc(when)}</span><span>${esc(opts.note || tv)}</span></div>
  </a>`;
}

async function teamCard([id, label]) {
  const [t, sched] = await Promise.all([espn(`football/college-football/teams/${id}`), espn(`football/college-football/teams/${id}/schedule`).catch(() => null)]);
  const team = t.team;
  const evs = sched?.events || [];
  const last = evs.filter(e => e.competitions?.[0]?.status?.type?.state === "post").at(-1);
  const now = evs.find(e => e.competitions?.[0]?.status?.type?.state === "in");
  const next = team.nextEvent?.[0];
  const show = [now || null, !now && last ? last : null, next && next.id !== now?.id && next.id !== last?.id ? next : null].filter(Boolean);
  return `<section class="panel team">
    <div class="hd"><img src="${esc(team.logos?.[0]?.href || "")}" alt=""><div><b>${team.rank ? `#${team.rank} ` : ""}${esc(team.displayName)}</b><span class="muted">${esc(team.record?.items?.[0]?.summary || "")}${team.standingSummary ? " · " + esc(team.standingSummary) : ""}</span></div></div>
    <div class="games">${show.map(e => gameHTML(e)).join("") || `<p class="muted">No games scheduled.</p>`}</div>
  </section>`;
}

function headsHTML(arts) {

    <h2>NFL <small>${nfl?.week?.number ? "Week " + nfl.week.number : ""}</small></h2>

/* ---------- feedback: hide, thumbs up/down, learned ranking ---------- */
// Rows mirror tangent_get_feedback. Saved on this device right away, and to your account
// (or, before accounts, the owner key) so hides and votes follow you across devices.
let feedback = store.get("feedback", []);
let me = store.get("me", null);
let prefs = {}, hiddenStories = new Set(), hiddenArticles = new Set(), votes = new Map();
const STOP = new Set("the and for with from that this into over after about what when where will have has are was were its his her their they you your our new more says said how why who can could would than just also amid".split(" "));
const fwords = t => [...new Set((t || "").toLowerCase().replace(/[^a-z0-9 ]+/g, " ").split(" ").filter(w => w.length > 3 && !STOP.has(w)))];

// Each thing you vote on (source, topic, format, headline words) gets a score from -1 to 1,
// shrunk toward 0 until there are a few votes behind it. Hiding counts as a mild "less".
function learn() {
  hiddenStories = new Set(); hiddenArticles = new Set(); votes = new Map();
  const acc = new Map();
  const add = (k, v) => { const a = acc.get(k) || { s: 0, n: 0 }; a.s += v; a.n += 1; acc.set(k, a); };
  for (const r of feedback) {
    if (r.hidden) { hiddenArticles.add(r.article_id); if (r.cluster_id) hiddenStories.add(r.cluster_id); }
    if (r.vote) votes.set(r.article_id, r.vote);
    const v = r.vote || (r.hidden ? -0.25 : 0);
    if (!v) continue;
    add("s" + r.source_id, v); add("t" + r.topic, v); add("k" + r.kind, v);
    for (const w of fwords(r.title)) add("w" + w, v);
  }
  prefs = {};
  // Needs several votes before any one source, topic or word moves much.
  for (const [k, a] of acc) prefs[k] = a.s / (a.n + 5);
}
function prefScore(it) {
  const p = k => prefs[k] || 0;
  const ws = fwords(it.story_headline || it.title).map(w => p("w" + w)).filter(Boolean).sort((a, b) => Math.abs(b) - Math.abs(a)).slice(0, 3);
  const words = ws.length ? ws.reduce((a, b) => a + b, 0) / ws.length : 0;
  // Source and headline words carry most of it; topic and format only lean.
  return 0.5 * p("s" + it.source_id) + 0.15 * p("t" + it.topic) + 0.1 * p("k" + it.kind) + 0.4 * words;
}
const isHidden = it => hiddenArticles.has(it.id) || (it.cluster_id && hiddenStories.has(it.cluster_id));

async function saveFeedback(it, change) {
  let row = feedback.find(r => r.article_id === it.id);
  if (!row) { row = { article_id: it.id, cluster_id: it.cluster_id, vote: 0, hidden: false, source_id: it.source_id, topic: it.topic, kind: it.kind, title: it.title }; feedback.unshift(row); }
  Object.assign(row, change, { at: new Date().toISOString() });
  store.set("feedback", feedback);
  learn();
  if (signedIn()) {
    try { await api("feedback", { article: it.id, vote: change.vote ?? null, hidden: change.hidden ?? null }); }
    catch (e) { toast(e instanceof TypeError ? "Saved on this device only. No connection to the server." : "Saved on this device only. " + e.message); }
    return;
  }
  const key = store.get("ownerKey", "");
  if (!key) return;
  try {
    await rpc("tangent_set_feedback", { p_key: key, p_article: it.id, p_vote: change.vote ?? null, p_hidden: change.hidden ?? null });
  } catch (e) {
    const offline = e instanceof TypeError; // fetch itself failed: no connection
    toast(offline ? "Saved on this phone only. No connection to the server." : /bad key/.test(e.message)
      ? "Saved on this phone only. Open your setup link to sync." : "Saved on this phone only. The server refused it.");
  }
}
async function loadFeedback() {
  const key = store.get("ownerKey", "");
  if (!signedIn() && !key) return;
  try {
    feedback = signedIn() ? await api("feedback") : await rpc("tangent_get_feedback", { p_key: key });
    store.set("feedback", feedback);
    learn();
    if (view === "news") render();
  } catch {}
}

let toastTimer, undoFn;
function toast(msg, undo) {
  $("toastMsg").textContent = msg;
  $("toastUndo").hidden = !undo;
  undoFn = undo;
  $("toast").hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $("toast").hidden = true; undoFn = null; }, 6000);
}
$("toastUndo").addEventListener("click", () => { const f = undoFn; $("toast").hidden = true; undoFn = null; if (f) f(); });

function hideStory(id) {
  const it = state.items.find(x => x.id === id);
  if (!it) return;
  saveFeedback(it, { hidden: true });
  if (!$("reader").hidden) closeReader(false);
  rerender();
  toast("Story hidden", () => { saveFeedback(it, { hidden: false }); rerender(); });
}
function vote(id, v) {
  const it = state.items.find(x => x.id === id);
  if (!it) return;
  const next = votes.get(id) === v ? 0 : v; // tapping again clears the vote
  saveFeedback(it, { vote: next });
  syncVoteButtons(id);
  if (next === 1) toast("More stories like this");
  else if (next === -1) toast("Fewer stories like this", () => { saveFeedback(it, { vote: 0 }); syncVoteButtons(id); });
}
function syncVoteButtons(id) {
  if (+$("reader").dataset.id === id)
    for (const b of document.querySelectorAll("#rActs [data-vote]")) b.setAttribute("aria-pressed", String(votes.get(id) === +b.dataset.vote));
  for (const b of document.querySelectorAll(`[data-cvote][data-for="${id}"]`)) b.setAttribute("aria-pressed", String(votes.get(id) === +b.dataset.cvote));
}
function rerender() {
  if (view === "news") render();
  if (view === "sports" && $("sportsView").dataset.built) renderSports();
}
$("rActs").addEventListener("click", e => {
  const id = +$("reader").dataset.id;
  const v = e.target.closest("[data-vote]");
  if (v) return vote(id, +v.dataset.vote);
  if (e.target.closest("[data-hide-reader]")) hideStory(id);
});
learn();

// The owner key arrives once via #key=... and stays on this device.
(function takeKey() {
  const m = location.hash.match(/key=([a-f0-9]{32})/);
  if (m) { store.set("ownerKey", m[1]); history.replaceState(null, "", location.pathname); }
})();
async function rpc(fn, args) {
  const r = await fetch(SB + "rpc/" + fn, { method: "POST", headers: { apikey: SB_KEY, authorization: "Bearer " + SB_KEY, "content-type": "application/json" }, body: JSON.stringify(args) });
  if (!r.ok) throw new Error(await r.text());
  // 204 means saved with nothing to return; reading JSON from it would throw.
  return r.status === 204 ? null : r.json();
}
async function renderSuggestions() {
  const box = $("suggList");

      <div><b>${esc(r.name)}</b> <span class="muted">· ${esc(TOPIC_NAMES[r.topic] || r.topic)} · ${esc(r.domain)}</span></div>

    </div>`).join("")}</div>`;

/* ---------- account ---------- */
// The session cookie is HttpOnly; tg_in is its readable shadow, so the page knows without asking.
const signedIn = () => /(^|;\s*)tg_in=1/.test(document.cookie);
// Each device reads as one persona at a time; the server falls back to the first if this one is gone.
const personaId = () => store.get("persona", null);
async function api(path, body) {
  const headers = personaId() ? { "x-persona": String(personaId()) } : {};
  const r = await fetch("/api/v1/" + path, body === undefined ? { credentials: "same-origin", headers }
    : { method: "POST", credentials: "same-origin", headers: { ...headers, "content-type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && path !== "auth/login") signedOutHere();
  if (!r.ok) throw new Error(j.error || "Something went wrong. Please try again.");
  return j;
}
const shelfKey = m => JSON.stringify((m?.shelves || []).map(s => [s.id, s.name, s.sources.map(x => x.id)]));
function setMe(next) {
  const changed = shelfKey(next) !== shelfKey(me);
  me = next; store.set("me", me);
  if (me?.persona) store.set("persona", me.persona);
  renderAcctBtn();
  if (changed) { renderTabs(); if (view === "news") render(); load(); }
}
async function loadMe() {
  if (!signedIn()) { if (me) setMe(null); return; }
  try { setMe(await api("me")); } catch { return; }
  // The original owner's device moves its pre-account votes and admin rights onto this account.
  const key = store.get("ownerKey", "");
  if (key && !me.user.is_admin) { try { if ((await api("me/claim", { key })).ok) { setMe(await api("me")); loadFeedback(); } } catch {} }
  if (!hasShelves() && !store.get("picked:" + me.persona, false)) openTopics(true);
  // A device that turned on alerts before signing in moves them to this account.
  attachPush();
}
function signedOutHere() {
  for (const k of ["me", "feedback", "feed", "persona"]) store.del(k);
  me = null; feedback = []; learn();
  if (!/(^|;\s*)tg_guest=1/.test(document.cookie) && !store.get("ownerKey", "")) location.replace("/welcome");
  else { renderAcctBtn(); renderTabs(); load(); }
}
// A persona's face: its picture, else its emoji, else its first letter on its color.

// Pictures are shrunk on the device to a 160px square before upload, so they stay a few KB.
async function shrinkImage(file) {
  const bmp = await createImageBitmap(file);
  const side = Math.min(bmp.width, bmp.height), c = document.createElement("canvas");
  c.width = c.height = 160;
  c.getContext("2d").drawImage(bmp, (bmp.width - side) / 2, (bmp.height - side) / 2, side, side, 0, 0, 160, 160);
  let url = c.toDataURL("image/webp", 0.82);
  if (!url.startsWith("data:image/webp")) url = c.toDataURL("image/jpeg", 0.82); // Safari cannot write WebP
  for (let q = 0.7; url.length > 38000 && q > 0.3; q -= 0.15) url = c.toDataURL("image/jpeg", q);
  return url;
}

// Suggestions: catalog sources in the shelf's topic or with recent stories on its words (instant),
// plus outlets the fetcher keeps finding in the news for the shelf's phrase.
async function shelfSuggestions(id) {
  const x = me.shelves.find(s => s.id === id), box = $("suggSrcs");
  if (!x || !box) return;
  const have = new Set(x.sources.map(s => s.id));
  const out = new Map();
  try {
    if (x.topic) for (const r of await sb(`tangent_sources?select=id,name,site_url&topic=eq.${encodeURIComponent(x.topic)}&status=eq.active&enabled=is.true&kind=neq.search&order=name&limit=30`))
      if (!have.has(r.id)) out.set("s" + r.id, { name: r.name, sub: "From this topic's catalog", source: r.id });
    const words = fwords(x.query || x.name).map(w => w.replace(/[^\w-]/g, "")).filter(Boolean).slice(0, 3);
    const look = async ws => sb(`tangent_feed?select=source_id,source_name,kind&and=(${ws.map(w => `title.ilike.${encodeURIComponent(`"*${w}*"`)}`).join(",")})&kind=neq.search&order=published_at.desc&limit=300`);
    let rows = words.length ? await look(words) : [];
    if (rows.length < 2 && words.length > 1) rows = await look([words.sort((a, b) => b.length - a.length)[0]]);
    const count = new Map();
    for (const r of rows) if (!have.has(r.source_id)) count.set(r.source_id, { name: r.source_name, n: (count.get(r.source_id)?.n || 0) + 1 });
    for (const [sid, c] of [...count].filter(([, c]) => c.n >= 2).sort((a, b) => b[1].n - a[1].n).slice(0, 8))
      if (!out.has("s" + sid)) out.set("s" + sid, { name: c.name, sub: `${c.n} recent stories about this`, source: sid });
  } catch {}
  try {
    const { suggestions } = await api("shelves/suggestions?shelf=" + id);
    for (const g of suggestions) {
      const key = g.source ? "s" + g.source : "d" + g.domain;
      if ((g.source && have.has(g.source)) || out.has(key)) continue;
      out.set(key, { name: g.name, sub: `${g.domain} \u00b7 ${g.hits === 1 ? "one recent story" : `${g.hits} recent stories`} about this`, source: g.source, url: g.url });
    }
  } catch {}
  if (!$("suggSrcs")) return; // the panel moved on
  const list = [...out.values()].slice(0, 12);
  $("suggAll").hidden = list.length < 2;
  box.innerHTML = list.map(o => `<li><span class="txt"><b>${esc(o.name)}</b><span class="sub">${esc(o.sub)}</span></span>${o.source ? `<button class="small add" data-addsrc="${o.source}">Add</button>` : `<button class="small add" data-addurl="${esc(o.url)}">Add</button>`}</li>`).join("")
    || `<li><span class="txt"><span class="sub">${x.query ? "Tangent is searching the news for this topic. Suggestions show up here within about 15 minutes." : "No suggestions right now. Search or paste a source below."}</span></span></li>`;
}
function suggEmpty() {
  const box = $("suggSrcs");
  if (!box) return;
  $("suggAll").hidden = box.querySelectorAll("[data-addsrc],[data-addurl]").length < 2;
  if (!box.children.length) box.innerHTML = `<li><span class="txt"><span class="sub">All suggestions added. More show up as Tangent finds them.</span></span></li>`;

// Add every suggestion in one go, then refresh the shelf once.
document.addEventListener("click", async e => {
  const b = e.target.closest("#suggAll");
  if (!b) return;
  const shelf = +$("shelfSrcs").dataset.shelf;

    } catch { failed++; }
  }

  const x = me.shelves.find(s => s.id === shelf);
  $("shelfSrcs").innerHTML = x.sources.map(s => srcRow(s, shelf)).join("");
  b.disabled = false; b.textContent = "Add all suggested sources";
  suggEmpty();
  toast(failed ? `Added all but ${failed}. Try those again.` : "All suggestions added");
});
const looksLikeUrl = q => /^@[\w.-]{2,}$/.test(q) || (/^\S+\.[a-z]{2,}(\/\S*)?$/i.test(q) && !/\s/.test(q));
async function searchSources(shelfId, mine, latest) {
  const q = $("srcQ").value.trim(), box = $("srcRes");
  $("srcErr").textContent = "";
  if (q.length < 2) { box.hidden = true; return; }
  const have = new Set(me.shelves.find(s => s.id === shelfId)?.sources.map(s => s.id));
  const safe = q.replace(/[^\w .@-]/g, " ").trim().replace(/\s+/g, "*");
  let rows = [];
  if (safe) try { rows = await sb(`tangent_sources?select=id,name,kind,site_url,access&status=eq.active&enabled=eq.true&or=(name.ilike.${encodeURIComponent(`"*${safe}*"`)},site_url.ilike.${encodeURIComponent(`"*${safe}*"`)})&order=name&limit=8`); } catch {}
  if (mine !== latest()) return; // a newer keystroke already searched
  const out = rows.map(r => `<li><span class="txt"><b>${esc(r.name)}</b><span class="sub">${esc(KIND_LABEL[r.kind] || "News")} · ${esc(r.site_url.replace(/^https?:\/\/(www\.)?/, ""))}</span></span>${have.has(r.id) ? `<span class="sub">Added</span>` : `<button class="small add" data-addsrc="${r.id}">Add</button>`}</li>`);
  if (looksLikeUrl(q)) out.unshift(`<li><span class="txt"><b>${esc(q)}</b><span class="sub">Add this site. Tangent checks it first.</span></span><button class="small add" data-req="url">Add</button></li>`);
  else out.push(`<li><span class="txt"><b>“${esc(q)}” in the news</b><span class="sub">Follow this phrase across news sites</span></span><button class="small add" data-req="query">Follow</button></li>`);
  box.innerHTML = out.join(""); box.hidden = false;
}
$("rBody").addEventListener("click", async e => {
  const t = e.target.closest("[data-edit],[data-move],[data-unsrc],[data-addsrc],[data-addurl],[data-req]");
  if (!t) return;
  if (t.dataset.edit) return openShelf(+t.dataset.edit);
  if (t.dataset.move) {
    const ids = me.shelves.map(s => s.id), i = ids.indexOf(+t.dataset.move), j = i + +t.dataset.dir;
    [ids[i], ids[j]] = [ids[j], ids[i]];
    setMe({ ...me, shelves: ids.map(id => me.shelves.find(s => s.id === id)) });
    openShelves();
    document.querySelector(`[data-move="${ids[j]}"][data-dir="${t.dataset.dir}"]:not(:disabled)`)?.focus();
    try { await api("shelves/order", { ids }); } catch (x) { toast(x.message); refreshMe(); }
    return;
  }
  const shelf = +$("shelfSrcs")?.dataset.shelf;
  if (!shelf) return;
  t.disabled = true;
  try {
    if (t.dataset.unsrc) await api("shelves/source", { shelf, source: +t.dataset.unsrc, add: false });
    if (t.dataset.addsrc) await api("shelves/source", { shelf, source: +t.dataset.addsrc, add: true });
    if (t.dataset.addurl) await api("shelves/request", { shelf, url: t.dataset.addurl });
    if (t.dataset.req) {
      const q = $("srcQ").value.trim();
      await api("shelves/request", t.dataset.req === "url" ? { shelf, url: q } : { shelf, query: q });
      $("srcQ").value = ""; $("srcRes").hidden = true;
    }
    await refreshMe();
    const x = me.shelves.find(s => s.id === shelf);
    $("shelfSrcs").innerHTML = x.sources.map(s => srcRow(s, shelf)).join("") || `<li><span class="txt"><span class="sub">No sources yet. Add some below.</span></span></li>`;
    // An added suggestion leaves the list; search results just say Added.
    if (t.closest("#suggSrcs")) { t.closest("li").remove(); suggEmpty(); }
    else if (t.dataset.addsrc || t.dataset.addurl) { t.replaceWith(Object.assign(document.createElement("span"), { className: "sub", textContent: "Added" })); }
  } catch (x) { $("srcErr").textContent = x.message; t.disabled = false; }
});

/* ---------- alerts and push notifications ---------- */
// The private half of this key is only in the database, read by the fetcher that sends the pushes.
const VAPID_PUBLIC = "BKu1JOaawoj4cdwJ2sD3D-MGJgtypNP7m7lojZhQORD_NEfID8CJYkSwfe-YQ6b_VTtyw9iBBn0tQSWd25Kznlc";
const QUIET = [["22,7", "10 pm to 7 am"], ["23,6", "11 pm to 6 am"], ["21,8", "9 pm to 8 am"], ["0,0", "Off"]];
const MAXES = [3, 5, 10, 20];
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
const b64key = s => Uint8Array.from(atob((s + "===".slice((s.length + 3) % 4)).replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0));
let alertData = null;

async function pushState() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window))
    return isIOS && !standalone ? "ios" : "unsupported";
  if (Notification.permission === "denied") return "denied";
  const reg = await navigator.serviceWorker.getRegistration();
  const sub = reg && await reg.pushManager.getSubscription();
  return sub ? "on" : "off";
}
async function renderPushBox() {
  const st = await pushState(), box = $("pushBox");
  if (!box) return;
  box.innerHTML = {
    ios: `<p>On iPhone and iPad, alerts work once Tangent is on your Home Screen. Tap Share, then Add to Home Screen, then open Tangent from there and come back here.</p>`,
    unsupported: `<p>This browser can't show notifications. Try Chrome, Edge, Firefox or Safari.</p>`,
    denied: `<p>Notifications are blocked for Tangent. Allow them in your browser or phone settings, then come back here.</p>`,
    off: `<p>${signedIn() ? "Get a notification on this device when an alert below matches." : "Turn on big-story notifications for this device."}</p><button class="bigbtn primary" data-push="on">Turn on notifications</button>`,
    on: `<p>Notifications are on for this device.</p><div class="row"><button class="bigbtn" data-push="test">Send a test</button><button class="bigbtn" data-push="off">Turn off here</button></div>`,
  }[st];
}
// Guests have no account, so the device keeps its own random key to manage its subscription.
function guestKey() {
  let k = store.get("guestPushKey", "");
  if (!k) { k = btoa(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(24)))).replace(/\+/g, "-").replace(/\//g, "_"); store.set("guestPushKey", k); }
  return k;
}
const tzName = () => Intl.DateTimeFormat().resolvedOptions().timeZone;
async function attachPush() {
  if (!signedIn() || !("serviceWorker" in navigator) || store.get("pushAttached", "") === me?.user?.id) return;
  try {
    const sub = await (await navigator.serviceWorker.getRegistration())?.pushManager.getSubscription();
    if (sub) { await api("push/subscribe", { subscription: sub.toJSON(), tz: tzName() }); store.set("pushAttached", me.user.id); }
  } catch {}
}
async function pushToggle(what) {
  const reg = await navigator.serviceWorker.ready;
  if (what === "test") return reg.showNotification("Tangent alerts are working", { body: "This is how a big story or one of your alerts will look.", icon: "app-icon-v2-192.png", tag: "test" });
  if (what === "off") {
    const sub = await reg.pushManager.getSubscription();
    if (sub) {
      await (signedIn() ? api("push/unsubscribe", { endpoint: sub.endpoint }) : api("push/guest", { subscription: sub.toJSON(), key: guestKey(), on: false })).catch(() => {});
      await sub.unsubscribe();
    }
    store.del("pushAttached");
    return renderPushBox();
  }
  if (await Notification.requestPermission() !== "granted") return renderPushBox();
  const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64key(VAPID_PUBLIC) });
  if (!signedIn()) {
    await api("push/guest", { subscription: sub.toJSON(), tz: tzName(), key: guestKey(), on: true });
    renderPushBox();
    return toast("Notifications on. You'll hear about big stories.");
  }
  await api("push/subscribe", { subscription: sub.toJSON(), tz: tzName() });
  store.set("pushAttached", me.user.id);
  alertData = await api("alerts");
  renderAlertList(); renderPushBox();
  toast("Notifications on. Big stories are on by default.");
}

function alertLabel(a) {
  if (a.kind === "big") return ["Big stories", "When 4 or more outlets cover a story on your shelves"];
  if (a.kind === "keyword") return [`“${a.phrase}”`, "Any headline or teaser that mentions it"];
  if (a.kind === "shelf") return [me.shelves.find(s => s.id === a.shelf)?.name || "A removed shelf", "New stories on this shelf, at most hourly"];
  return [a.source_name || "Source", "Every new story from this source"];
}
function renderAlertList() {
  const box = $("alertList");
  if (!box || !alertData) return;
  const rows = alertData.alerts.map(a => {
    const [t, sub] = alertLabel(a);
    return `<li><span class="txt"><b>${esc(t)}</b><span class="sub">${esc(sub)}</span></span>${a.kind === "big" ? "" : `<button class="small" data-alert-rm="${a.id}" aria-label="Remove alert ${esc(t)}">Remove</button>`}<button class="switch" role="switch" aria-checked="${a.enabled}" data-alert-on="${a.id}" aria-label="${esc(t)}"></button></li>`;
  });
  if (!alertData.alerts.some(a => a.kind === "big")) rows.unshift(`<li><span class="txt"><b>Big stories</b><span class="sub">When 4 or more outlets cover a story on your shelves</span></span><button class="switch" role="switch" aria-checked="false" data-alert-big aria-label="Big stories"></button></li>`);
  box.innerHTML = rows.join("");
  $("recentAlerts").innerHTML = alertData.recent.length ? alertData.recent.map(r => `<li><span class="txt"><b>${esc(r.title || "")}</b><span class="sub">${ago(r.at)} ago</span></span></li>`).join("") : `<li><span class="txt"><span class="sub">Nothing sent yet.</span></span></li>`;
}
async function openAlerts() {
  if (!me?.user) {
    // Without an account: big stories on this device. Your own alerts need an account.
    openPanel("alerts", `<h1>Alerts</h1>
      <p class="lead">Get a notification when a big story breaks: four or more outlets covering the same news within a day. At most 5 a day, and none from 10 pm to 7 am.</p>
      <div class="pushbox" id="pushBox">Checking this device\u2026</div>
      <p class="lead">Want alerts for words, shelves or sources you pick? <a href="/welcome#signup">Create a free account</a>.</p>`);
    return renderPushBox();
  }
  const prefs = { max: 10, quiet: [22, 7], ...(me.user.settings?.alerts || {}) };
  const sources = [...new Map(me.shelves.flatMap(s => s.sources).filter(s => s.status === "active").map(s => [s.id, s])).values()].sort((a, b) => a.name.localeCompare(b.name));
  openPanel("alerts", `<h1>Alerts</h1>
    <p class="lead">Tangent can tell you when a big story breaks, or when something you follow shows up. Alerts are checked every 15 minutes.</p>
    <div class="pushbox" id="pushBox">Checking this device…</div>
    <div class="sec">Alert me about</div><ul class="list srcs" id="alertList"><li><span class="txt"><span class="sub">Loading…</span></span></li></ul>
    <div class="sec">Add an alert</div>
    <form class="inline" id="kwForm"><label class="field"><span>A word or phrase</span><input id="kwIn" maxlength="60" autocomplete="off" placeholder="hurricane, FPL rate case"></label><button class="bigbtn primary">Add</button></form>
    <p class="ferr" id="alErr" role="alert"></p>
    ${me.shelves.length ? `<form class="inline" id="shForm"><label class="field"><span>New stories on a shelf</span><select id="shIn">${me.shelves.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join("")}</select></label><button class="bigbtn">Add</button></form><p></p>` : ""}
    ${sources.length ? `<form class="inline" id="srForm"><label class="field"><span>Every story from a source</span><select id="srIn">${sources.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join("")}</select></label><button class="bigbtn">Add</button></form>` : ""}
    <div class="sec">Delivery</div>
    <label class="field"><span>Quiet hours (no alerts)</span><select id="quietIn">${QUIET.map(([v, l]) => `<option value="${v}" ${v === prefs.quiet.join(",") ? "selected" : ""}>${l}</option>`).join("")}</select></label>
    <label class="field"><span>Most alerts per day</span><select id="maxIn">${MAXES.map(n => `<option ${n === prefs.max ? "selected" : ""}>${n}</option>`).join("")}</select></label>
    <div class="sec">Recently sent</div><ul class="list srcs" id="recentAlerts"></ul>`);
  renderPushBox();
  const add = async body => { $("alErr").textContent = ""; try { await api("alerts/save", body); alertData = await api("alerts"); renderAlertList(); } catch (x) { $("alErr").textContent = x.message; } };
  $("kwForm").addEventListener("submit", e => { e.preventDefault(); const p = $("kwIn").value.trim(); if (p) add({ kind: "keyword", phrase: p }).then(() => { $("kwIn").value = ""; }); });
  $("shForm")?.addEventListener("submit", e => { e.preventDefault(); add({ kind: "shelf", shelf: +$("shIn").value }); });
  $("srForm")?.addEventListener("submit", e => { e.preventDefault(); add({ kind: "source", source: +$("srIn").value }); });
  const savePrefs = async () => {
    const alerts = { quiet: $("quietIn").value.split(",").map(Number), max: +$("maxIn").value };
    try { const { user } = await api("me/settings", { settings: { ...(me.user.settings || {}), alerts } }); setMe({ ...me, user }); toast("Saved"); }
    catch (x) { $("alErr").textContent = x.message; }
  };
  $("quietIn").addEventListener("change", savePrefs);
  $("maxIn").addEventListener("change", savePrefs);
  try { alertData = await api("alerts"); renderAlertList(); } catch (x) { $("alErr").textContent = x.message; }
}
$("rBody").addEventListener("click", async e => {
  const p = e.target.closest("[data-push]");
  if (p) { p.disabled = true; try { await pushToggle(p.dataset.push); } catch (x) { toast("Could not change notifications: " + x.message); renderPushBox(); } return; }
  const t = e.target.closest("[data-alert-on],[data-alert-rm],[data-alert-big]");
  if (!t) return;
  try {
    if (t.dataset.alertOn) { const on = t.getAttribute("aria-checked") !== "true"; t.setAttribute("aria-checked", String(on)); await api("alerts/save", { id: +t.dataset.alertOn, enabled: on }); }
    if (t.dataset.alertRm) await api("alerts/remove", { id: +t.dataset.alertRm });
    if (t.dataset.alertBig !== undefined) await api("alerts/save", { kind: "big" });
    alertData = await api("alerts"); renderAlertList();
  } catch (x) { $("alErr").textContent = x.message; }
});

// A publisher's image that fails to load turns its card into a text card instead of an empty box.
document.addEventListener("error", e => {
  const img = e.target;
  if (img.tagName !== "IMG" || !img.closest(".card")) return;
  img.closest(".card").classList.add("noimg");
  img.remove();
}, true);

// A tapped notification opens its story: /#a=123 on launch, or a message from the service worker.
async function openArticle(id) {
  if (!state.items.some(x => x.id === id)) {
    try {
      const rows = await sb(`tangent_feed?id=eq.${id}&select=*`);
      if (rows[0]?.kind === "search" && rows[0].author) rows[0].source_name = rows[0].author;
      if (rows[0]) state.items.push(rows[0]);
    } catch {}
  }
  if (view !== "news") setView("news");
  openReader(id);
}
const launchArticle = +(location.hash.match(/^#a=(\d+)$/) || [])[1] || 0;
navigator.serviceWorker?.addEventListener("message", e => { const m = (e.data?.open || "").match(/#a=(\d+)$/); if (m) openArticle(+m[1]); });

/* ---------- load ---------- */
async function load() {
  try {
    // Each topic loads its own newest stories, so a quiet topic (Vermont) is never crowded
    // out by a busy one (sports videos). Bodies are not in the feed, so this stays light.
    // With shelves, each shelf loads by its own sources. Sports always loads for the Sports tab.
    const queries = (hasShelves()
      ? me.shelves.filter(s => s.sources.length).map(s => `source_id=in.(${s.sources.map(x => x.id).join(",")})&limit=160`)
      : TOPICS.map(t => t[0]).filter(Boolean).map(t => `topic=eq.${t}&limit=80`)).concat("topic=eq.sports&limit=60");
    const lists = await Promise.all(queries.map(q => sb(`tangent_feed?select=*&${q}&order=published_at.desc`)));
    const seen = new Set();
    // Stories from a shelf's phrase search credit the outlet that published them.
    for (const r of lists.flat()) if (r.kind === "search" && r.author) r.source_name = r.author;
    const rows = lists.flat().filter(r => !seen.has(r.id) && seen.add(r.id)).sort((a, b) => b.published_at.localeCompare(a.published_at));
    state.items = rows;
    store.set("feed", rows);
    if (view === "news") render();
    if (view === "sports" && $("sportsView").dataset.built) renderSports();
  } catch (e) {
    if (!state.items.length) { $("empty").hidden = false; $("empty").textContent = "Could not reach the news server. Pull to retry when you are back online."; }
  }
}

if (location.hash && !/key=/.test(location.hash)) history.replaceState(null, "", location.pathname);
renderTabs();
renderAcctBtn();
setView(view);
for (const x of document.querySelectorAll(".kinds button")) x.setAttribute("aria-pressed", String(x.dataset.kind === state.kind));
render();
load();
loadMe();
if (launchArticle) openArticle(launchArticle);
loadTrends();
loadFeedback();
setInterval(() => { load(); loadTrends(); loadFeedback(); }, 10 * 60e3);
// Quotes and scores refresh every minute while their tab is open.
setInterval(() => { if (document.visibilityState !== "visible") return; if (view === "stocks") loadStocks(); if (view === "sports") renderSports(); }, 60e3);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { load(); loadTrends(); } });
addEventListener("resize", () => { if (!flip) renderStage(); });

if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
